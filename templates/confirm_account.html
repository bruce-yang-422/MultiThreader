{% extends 'base.html' %}{% block content %}
<section class="panel max-w-lg mx-auto"><p class="eyebrow">CONFIRM ACCOUNT</p><h1>是這個帳號嗎？</h1><p class="muted my-5">請核對剛剛在 Threads 授權的帳號。</p>{% if profile.threads_profile_picture_url %}<img class="avatar" src="{{ profile.threads_profile_picture_url }}" alt="帳號頭像">{% endif %}<h2 class="mt-3">@{{ profile.username }}</h2><p class="fineprint">Threads ID：{{ profile.id }}</p><form method="post" class="mt-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="primary" name="action" value="confirm">確認連結</button><button class="secondary" name="action" value="cancel">取消</button></form></section>
{% endblock %}
