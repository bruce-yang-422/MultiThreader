{% extends 'base.html' %}{% block content %}<form method="post" class="panel max-w-lg mx-auto space-y-5"><h1>變更登入密碼</h1><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field">目前密碼<input type="password" name="old_password" required autocomplete="current-password"></label><label class="field">新密碼<input type="password" name="new_password" minlength="12" required autocomplete="new-password"></label><label class="field">確認新密碼<input type="password" name="confirm_password" minlength="12" required autocomplete="new-password"></label><button class="primary">儲存密碼</button></form>{% endblock %}
