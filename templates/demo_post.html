{% extends 'base.html' %}{% block content %}<article class="panel max-w-xl mx-auto"><p class="eyebrow">SIMULATED POST</p><h2>{{ job.account_label }}</h2><p class="post-copy my-5">{{ job.text }}</p>{% for item in media %}{% if item.media_type=='VIDEO' %}<video class="post-photo" controls src="{{ item.url }}"></video>{% else %}<img class="post-photo" src="{{ item.url }}" alt="模擬貼文圖片">{% endif %}{% endfor %}{% if job.first_reply %}<h3 class="mt-5">第一則回覆</h3><p class="post-copy">{{ job.first_reply }}</p>{% endif %}<p class="notice mt-5">這是模擬結果，沒有發布到 Threads。</p></article>{% endblock %}
